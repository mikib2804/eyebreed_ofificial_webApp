services:
  web:
    image: eyebreed-web:production
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_APP_URL: https://shop.eyebreedofficial.com
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        MEDIA_ALLOWED_HOSTS: ${MEDIA_ALLOWED_HOSTS:-images.unsplash.com}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_APP_URL: https://shop.eyebreedofficial.com
      AUTH_URL: https://shop.eyebreedofficial.com
      AUTH_TRUST_HOST: "true"
    expose:
      - "3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: shop.eyebreedofficial.com
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
